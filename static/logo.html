<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HyHOPE — living logo</title>
  <style>
    :root {
      --blue: #273f96;
      --yellow: #efc72b;
      --green: #91b991;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: transparent;
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .logo {
      display: block;
      width: min(86vw, 31rem);
      height: auto;
      overflow: visible;
      user-select: none;
    }

    #hands {
      transform-box: fill-box;
      transform-origin: 50% 87%;
      animation: breathe 5.8s ease-in-out infinite alternate;
      will-change: transform;
    }

    .particle {
      transform-box: fill-box;
      transform-origin: center;
      filter: url(#soft-edge);
      will-change: transform, opacity;
    }

    .particle.popping {
      animation: pop 420ms cubic-bezier(.3,.7,.35,1) forwards;
    }

    .pop-ring {
      fill: none;
      stroke-width: 1.7;
      transform-box: fill-box;
      transform-origin: center;
      pointer-events: none;
      animation: pressure-ring 420ms cubic-bezier(.15,.65,.25,1) forwards;
      will-change: transform, opacity;
    }

    @keyframes breathe {
      0%   { transform: translate(-.5px, .2px) rotate(-.18deg) scaleX(.998); }
      48%  { transform: translate(.6px, -1px) rotate(.22deg) scaleX(1.006); }
      100% { transform: translate(-.2px, -.3px) rotate(-.1deg) scaleX(1.001); }
    }

    @keyframes pop {
      0%   { opacity: 1; transform: scale(1); }
      18%  { opacity: 1; transform: scale(1.16); }
      34%  { opacity: .96; transform: scale(.82); }
      100% { opacity: 0; transform: scale(0); }
    }

    @keyframes pressure-ring {
      0%   { opacity: 0; transform: scale(.82); }
      15%  { opacity: .62; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.48); }
    }

    @media (prefers-reduced-motion: reduce) {
      #hands { animation: none; }
      .particle, .particle.popping, .pop-ring { animation: none; }
    }
  </style>
</head>
<body>
  <svg class="logo" viewBox="0 0 340.157 447.874" role="img"
       aria-labelledby="logo-title logo-description">
    <title id="logo-title">Animated HyHOPE logo</title>
    <desc id="logo-description">Blue hands cradle a gently changing cloud of blue, yellow and green circles.</desc>

    <defs>
      <filter id="flame-flicker" x="-8%" y="-5%" width="116%" height="112%"
              color-interpolation-filters="sRGB">
        <feTurbulence id="turbulence" type="fractalNoise" baseFrequency=".008 .022"
                      numOctaves="2" seed="7" result="noise"/>
        <feDisplacementMap id="displacement" in="SourceGraphic" in2="noise"
                           scale="1.8" xChannelSelector="R" yChannelSelector="B"/>
      </filter>
      <filter id="soft-edge" x="-15%" y="-15%" width="130%" height="130%">
        <feGaussianBlur stdDeviation=".12"/>
      </filter>
      <clipPath id="particle-window">
        <path d="M27 6H313V254
                 C291 222 278 195 269 164

                 C120 249 84 217 70 164
                 C61 195 48 222 27 254Z"/>
      </clipPath>
    </defs>

    <g id="particle-window" clip-path="url(#particle-window)">
      <g id="particles" aria-hidden="true"></g>
    </g>

  <script>
    (() => {
      'use strict';

      const NS = 'http://www.w3.org/2000/svg';
      const layer = document.querySelector('#particles');
      const turbulence = document.querySelector('#turbulence');
      const displacement = document.querySelector('#displacement');
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const colors = ['#273f96', '#273f96', '#273f96', '#efc72b', '#91b991'];
      const particles = [];
      const bounds = { left: 34, right: 306, top: 8, bottom: 259 };
      const random = (min, max) => min + Math.random() * (max - min);
      let previous = performance.now();
      let spawnClock = 0;
      let nextSpawn = random(.38, .76);
      let flickerClock = 0;
      let running = !document.hidden;

      function chamberHalfWidth(y) {
        // Broad at the top, gently tapering into the hands near the bottom.
        if (y < 160) return 136;
        return 136 - (y - 160) * .72;
      }

      function openPosition(radius = 3) {
        const candidates = [];

        // Sample the whole chamber, then strongly favor the least crowded spots.
        // Choosing from several good candidates keeps the result from looking gridded.
        for (let attempt = 0; attempt < 52; attempt++) {
          const y = random(bounds.top + radius, bounds.bottom - radius);
          const half = chamberHalfWidth(y) - radius;
          const x = random(170 - half, 170 + half);
          let clearance = 1000;

          for (const p of particles) {
            if (p.popping) continue;
            clearance = Math.min(clearance,
              Math.hypot(x - p.x, y - p.y) - radius - p.r);
          }
          candidates.push({ x, y, clearance });
        }

        candidates.sort((a, b) => b.clearance - a.clearance);
        const roomy = candidates.filter(candidate => candidate.clearance > 3);
        const pool = (roomy.length ? roomy : candidates).slice(0, 6);
        // The best candidate has the highest weight, with some natural variation.
        const pick = Math.floor(Math.pow(Math.random(), 2.4) * pool.length);
        return pool[pick] ?? { x: 170, y: 110 };
      }

      function makeParticle(options = {}) {
        const r = options.r ?? random(1.7, 3.4);
        const pos = options.x == null ? openPosition(r) : options;
        const circle = document.createElementNS(NS, 'circle');
        const color = options.color ?? colors[Math.floor(Math.random() * colors.length)];
        circle.classList.add('particle');
        circle.setAttribute('fill', color);
        circle.setAttribute('cx', pos.x);
        circle.setAttribute('cy', pos.y);
        circle.setAttribute('r', r);
        layer.append(circle);

        particles.push({
          el: circle,
          x: pos.x,
          y: pos.y,
          r,
          color,
          growth: options.growth ?? random(.42, 1.05),
          vx: random(-.48, .48),
          vy: random(-.34, .18),
          phase: random(0, Math.PI * 2),
          age: options.age ?? 0,
          grace: options.grace ?? random(1.1, 2.4),
          maxR: options.maxR ?? random(12, 26),
          popping: false
        });
      }

      function pop(p) {
        if (p.popping) return;
        p.popping = true;
        p.el.classList.add('popping');

        // This pressure ring shares the bubble's exact center. Explicit SVG
        // transform-box/origin rules keep its scale from drifting toward (0, 0).
        const ring = document.createElementNS(NS, 'circle');
        ring.classList.add('pop-ring');
        ring.setAttribute('cx', p.x);
        ring.setAttribute('cy', p.y);
        ring.setAttribute('r', p.r);
        ring.setAttribute('stroke', p.color);
        layer.append(ring);

        setTimeout(() => {
          ring.remove();
          p.el.remove();
          const index = particles.indexOf(p);
          if (index !== -1) particles.splice(index, 1);
        }, reducedMotion ? 0 : 430);
      }

      function seedLogo() {
        const seeds = [
          [76,31,6,'#273f96'], [102,20,9,'#91b991'], [132,38,6,'#efc72b'],
          [163,21,12,'#91b991'], [202,31,8,'#273f96'], [235,22,7,'#efc72b'],
          [267,38,6,'#273f96'], [53,62,7,'#efc72b'], [83,58,9,'#273f96'],
          [117,68,7,'#efc72b'], [151,59,8,'#273f96'], [190,61,13,'#91b991'],
          [228,67,10,'#91b991'], [271,73,8,'#efc72b'], [42,95,6,'#273f96'],
          [70,93,7,'#273f96'], [101,101,14,'#91b991'], [139,91,8,'#273f96'],
          [169,105,7,'#efc72b'], [205,99,7,'#273f96'], [244,105,8,'#273f96'],
          [287,101,6,'#efc72b'], [57,132,5,'#273f96'], [87,140,6,'#efc72b'],
          [122,132,8,'#273f96'], [154,145,12,'#91b991'], [190,137,6,'#273f96'],
          [224,145,8,'#efc72b'], [262,135,5,'#273f96'], [78,176,6,'#273f96'],
          [112,179,7,'#273f96'], [143,185,6,'#efc72b'], [175,177,8,'#273f96'],
          [208,185,6,'#273f96'], [240,176,5,'#273f96'], [104,215,5,'#273f96'],
          [137,222,5,'#273f96'], [169,215,6,'#273f96'], [200,224,5,'#273f96'],
          [229,211,5,'#273f96'], [151,248,4,'#273f96'], [188,246,4,'#273f96']
        ];

        seeds.forEach(([x,y,r,color]) => makeParticle({
          x, y, r, color, age: random(0, 5), grace: random(2.5, 5),
          growth: random(.14, .42), maxR: random(Math.max(r + 5, 14), 27)
        }));
      }

      function updateParticle(p, dt, now) {
        p.age += dt;
        p.r += p.growth * dt;

        const wander = now * .00055 + p.phase;
        p.vx += Math.sin(wander * 1.7) * .055 * dt;
        p.vy += Math.cos(wander * 1.3) * .045 * dt;
        // A light spring keeps the population gathered in the heart of the cup.
        // It is intentionally weaker than the individual wandering motion.
        p.vx += (170 - p.x) * .0024 * dt;
        p.vy += (132 - p.y) * .0015 * dt;
        p.vx *= Math.pow(.92, dt);
        p.vy *= Math.pow(.92, dt);
        p.x += (p.vx + Math.sin(wander) * .19) * dt;
        p.y += (p.vy + Math.cos(wander * .8) * .12) * dt;

        const half = chamberHalfWidth(p.y) - p.r;
        const left = 170 - half;
        const right = 170 + half;
        if (p.x < left) { p.x = left; p.vx = Math.abs(p.vx) * .7; }
        if (p.x > right) { p.x = right; p.vx = -Math.abs(p.vx) * .7; }
        if (p.y < bounds.top + p.r) { p.y = bounds.top + p.r; p.vy = Math.abs(p.vy) * .65; }
        if (p.y > bounds.bottom - p.r) { p.y = bounds.bottom - p.r; p.vy = -Math.abs(p.vy) * .65; }

        p.el.setAttribute('cx', p.x.toFixed(2));
        p.el.setAttribute('cy', p.y.toFixed(2));
        p.el.setAttribute('r', p.r.toFixed(2));
        if (p.r >= p.maxR) pop(p);
      }

      function resolveContacts() {
        for (let i = 0; i < particles.length; i++) {
          const a = particles[i];
          if (a.popping || a.age < a.grace) continue;
          for (let j = i + 1; j < particles.length; j++) {
            const b = particles[j];
            if (b.popping || b.age < b.grace) continue;
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const touching = Math.hypot(dx, dy) <= (a.r + b.r) * .985;
            if (touching) {
              pop(a.r >= b.r ? a : b);
              break;
            }
          }
        }
      }

      function frame(now) {
        if (!running) return;
        const dt = Math.min((now - previous) / 1000, .045);
        previous = now;
        spawnClock += dt;
        flickerClock += dt;

        particles.slice().forEach(p => !p.popping && updateParticle(p, dt, now));
        resolveContacts();

        const activeCount = particles.reduce((count, p) => count + !p.popping, 0);
        const populationBoost = activeCount < 38 ? .48 : 1;
        if (spawnClock > nextSpawn * populationBoost && activeCount < 58) {
          spawnClock = 0;
          nextSpawn = random(.38, .76);
          makeParticle();
        }

        if (flickerClock > .09) {
          flickerClock = 0;
          const wave = now * .0007;
          turbulence.setAttribute('baseFrequency',
            `${(.0075 + Math.sin(wave) * .0012).toFixed(4)} ${(.021 + Math.cos(wave * .73) * .003).toFixed(4)}`);
          displacement.setAttribute('scale', (1.55 + Math.sin(wave * 1.37) * .65).toFixed(2));
        }

        requestAnimationFrame(frame);
      }

      seedLogo();

      if (!reducedMotion) requestAnimationFrame(frame);

      document.addEventListener('visibilitychange', () => {
        running = !document.hidden;
        if (running && !reducedMotion) {
          previous = performance.now();
          requestAnimationFrame(frame);
        }
      });
    })();
  </script>
